# Continuous Integration workflow for FlowFi
# Covers frontend linting/build, backend build/test, and Soroban contract build/test.
name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

env:
  # Pinned contract build inputs so WASM artifacts and interface snapshots are
  # reproducible across CI runs and local machines. Bump intentionally and
  # regenerate snapshots (see contracts/README.md) when changing these.
  RUST_TOOLCHAIN: "1.79.0"
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: "-C debuginfo=0 -C codegen-units=1"
  SOURCE_DATE_EPOCH: "1700000000"

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Check changed files
        id: filter
        uses: dorny/paths-filter@15192bc058cc28a13dbf6cde61f19e18988b7af6 # v3
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'package-lock.json'

  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Lint
        run: npm run lint
        working-directory: frontend

      - name: Run Frontend Tests
        run: npm run test:coverage
        working-directory: frontend

      - name: Upload frontend coverage to Codecov
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: frontend/coverage/lcov.info
          flags: frontend
          name: frontend-coverage
          fail_ci_if_error: false
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Build
        run: npm run build
        working-directory: frontend

      - name: Check frontend bundle size
        run: bash ./scripts/check-bundle-size.sh
        working-directory: frontend

  backend:
    name: Backend CI
    runs-on: ubuntu-latest
    needs: changes
    if: >-
      github.event_name == 'push' ||
      needs.changes.outputs.backend == 'true'
    services:
      postgres:
        image: postgres:16-alpine@sha256:e013e867e712fec275706a6c51c966f0bb0c93cfa8f51000f85a15f9865a28cb
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: flowfi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Setup Database
        run: |
          npx prisma generate --schema=prisma/schema.prisma
          npx prisma db push --accept-data-loss --schema=prisma/schema.prisma
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:password@127.0.0.1:5432/flowfi_test

      - name: Build
        run: npm run build
        working-directory: backend

      - name: OpenAPI spec & API types drift check
        run: |
          cd backend
          npm run codegen:openapi
          cd ../frontend
          npm run codegen:api-types
          cd ..
          git diff --exit-code -- backend/swagger/flowfi.openapi.json frontend/src/lib/api-types.generated.ts

      - name: Run Backend Tests
        run: |
          ls -la src/generated/prisma
          npx vitest run --coverage --reporter=basic
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:password@127.0.0.1:5432/flowfi_test
          NODE_ENV: test

      - name: Upload backend coverage to Codecov
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: backend/coverage/lcov.info
          flags: backend
          name: backend-coverage
          fail_ci_if_error: false
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  backend-docker:
    name: Backend Docker Image CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Check changed files
        id: filter
        uses: dorny/paths-filter@15192bc058cc28a13dbf6cde61f19e18988b7af6 # v3
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'docker-compose.yml'

      - name: Build Docker Image
        if: steps.filter.outputs.backend == 'true' || github.event_name == 'push'
        run: docker build -f backend/Dockerfile backend -t flowfi-backend:test

      - name: Docker Compose Build
        if: steps.filter.outputs.backend == 'true' || github.event_name == 'push'
        run: docker compose build

      - name: Boot and Check Health
        if: steps.filter.outputs.backend == 'true' || github.event_name == 'push'
        run: |
          docker compose up -d postgres
          sleep 10
          DATABASE_URL=postgresql://flowfi:flowfi_dev_password@127.0.0.1:5433/flowfi \
            npm exec --workspace=backend -- prisma db push --accept-data-loss --schema=prisma/schema.prisma
          docker compose up -d backend
          # Poll /health instead of a fixed sleep so cold-boot / Prisma-warmup
          # latency does not flake the Backend Docker Image CI.
          for i in $(seq 1 60); do
            if curl --silent --fail --max-time 2 --connect-timeout 1 http://localhost:3001/health; then
              echo "Backend health check passed after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Backend health check did not pass within 60s"
          docker compose logs backend
          exit 1

  secret-leak:
    name: Secret-leak regression checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --include=optional

      # Runs the synthetic-canary redaction regression suite. The suite uses
      # only fake canary values (never real secrets) and asserts that
      # credentials, signed payloads, and wallet-linked secrets are redacted
      # from logs, artifacts, and failure diagnostics.
      - name: Run secret-leak regression tests
        run: npm run test:secret-leak
        working-directory: backend
        env:
          NODE_ENV: test

  contracts:
    name: Soroban Contracts CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@632
