name: CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

env:
  # Pinned contract build inputs so WASM artifacts and interface snapshots are
  # reproducible across CI runs and local machines. Bump intentionally and
  # regenerate snapshots (see contracts/README.md) when changing these.
  RUST_TOOLCHAIN: "1.79.0"
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: "-C debuginfo=0 -C codegen-units=1"
  SOURCE_DATE_EPOCH: "1700000000"

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      sdk: ${{ steps.filter.outputs.sdk }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check changed files
        id: filter
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'package-lock.json'
            sdk:
              - 'sdk/**'
              - 'contracts/**'
              - 'package-lock.json'

  architecture-docs:
    name: Architecture Docs Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Validate system context & trust-boundary map
        run: npm run docs:check-architecture
        working-directory: backend

  clean-clone:
    name: Clean clone verification
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: stable
      - run: bash scripts/verify-clean-clone.test.sh
      - run: bash scripts/verify-clean-clone.sh

  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Verify partner webhook sample
        run: node --test docs/api/examples/verify-webhook.test.mjs

      - name: Lint
        run: npm run lint
        working-directory: frontend

      - name: Run Frontend Tests
        run: npm run test:coverage
        working-directory: frontend

      - name: Upload frontend coverage to Codecov
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: frontend/coverage/lcov.info
          flags: frontend
          name: frontend-coverage
          fail_ci_if_error: false
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Build
        run: npm run build
        working-directory: frontend

      - name: Check frontend bundle size
        run: bash ./scripts/check-bundle-size.sh
        working-directory: frontend

  frontend-visual:
    name: Financial summary visual snapshots
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.2"
          cache: "npm"
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci --include=optional
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Compare reviewed baselines
        run: npm run test:visual
        working-directory: frontend

  backend:
    name: Backend CI
    runs-on: ubuntu-latest
    needs: manifests
    if: >-
      always() &&
      (needs.manifests.result == 'success' || needs.manifests.result == 'skipped')
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Run issue-link policy check
        env:
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
          GITHUB_HEAD_REF: ${{ github.head_ref }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/issue-link-policy.mjs

  issue-link-policy-tests:
    name: Issue-link policy self-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Run policy fixtures
        run: node --test .github/scripts/issue-link-policy.test.mjs

  accessibility-audit:
    name: Accessibility critical-flow audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspace: "contracts -> target"

      - name: Check Formatting
        run: cargo fmt --all -- --check
        working-directory: contracts

      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings
        working-directory: contracts

      - name: Build Contracts
        run: cargo build --target wasm32-unknown-unknown
        working-directory: contracts
